<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishigaki Tour | Language Select</title>
  <meta http-equiv="refresh" content="3; url=ja/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(145deg, #e6f7ff 0%, #eafcf8 55%, #fff6e5 100%);
      color: #12324a;
    }

    .panel {
      width: min(720px, 92vw);
      background: rgba(255, 255, 255, 0.86);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(18, 50, 74, 0.15);
      line-height: 1.7;
    }

    a {
      color: #0c6ea8;
      font-weight: 700;
    }
  </style>
  <script>
    (function () {
      var isJapanese = /^ja(?:-|$)/i.test(navigator.language || "");
      if (isJapanese) {
        window.location.replace("ja/");
      }
    })();
  </script>
</head>
<body>
  <main class="panel">
    <h1>石垣島オプショナルツアー</h1>
    <p>日本語環境を検出した場合は自動で日本語ページに移動します。</p>
    <p>自動で移動しない場合は <a href="ja/">日本語ページ</a> を開いてください。</p>
  </main>
</body>
</html>
