<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishigaki Tour | Language Select</title>
  <meta http-equiv="refresh" content="3; url=en/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(145deg, #e6f7ff 0%, #eafcf8 55%, #fff6e5 100%);
      color: #12324a;
    }

    .panel {
      width: min(720px, 92vw);
      background: rgba(255, 255, 255, 0.86);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(18, 50, 74, 0.15);
      line-height: 1.7;
    }

    a {
      color: #0c6ea8;
      font-weight: 700;
    }
  </style>
  <script>
    (function () {
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
      var preferred = (langs[0] || "").toLowerCase();
      if (/^ja(?:-|$)/i.test(preferred)) {
        window.location.replace("ja/");
        return;
      }
      if (/^ru(?:-|$)/i.test(preferred)) {
        window.location.replace("ru/");
        return;
      }
      window.location.replace("en/");
    })();
  </script>
</head>
<body>
  <main class="panel">
    <h1>Ishigaki Optional Tour</h1>
    <p>Pages are selected by browser language: Japanese or Russian.</p>
    <p>If automatic redirection does not work, open <a href="ja/">Japanese</a> or <a href="ru/">Russian</a>.</p>
  </main>
</body>
</html>
